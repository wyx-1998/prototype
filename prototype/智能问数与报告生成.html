<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问数与报告生成 - 国投集团智能安全生产管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hidden_danger.css">
    <link rel="stylesheet" href="css/smart_qa.css">
    <link rel="stylesheet" href="css/hidden_danger_list.css">
    <link rel="stylesheet" href="css/workbench_home.css">
    <link rel="stylesheet" href="css/intelligent_report.css">
    <link rel="stylesheet" href="components/ai-assistant.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="app-layout">
        <header id="appShellHeader"></header>
        <div class="main-body">
            <aside id="appShellSidebar"></aside>
            <main class="content-area smart-qa-content-area">
                <div class="content-tabs">
                    <div class="tab-item active">智能问数与报告生成 <i class="ph ph-x"></i></div>
                    <div class="tab-actions">
                        <i class="ph ph-star"></i>
                        <i class="ph ph-arrows-clockwise"></i>
                    </div>
                </div>
                <div id="appPageContainer"></div>
            </main>
            <div id="aiAssistantMount"></div>
        </div>

    <script src="components/app-config.js"></script>
    <script src="components/app-shell.js"></script>
    <script src="components/ai-assistant-shell.js"></script>
    <script src="components/ai-assistant-scenes.js"></script>

    <script src="js/smart_qa.js"></script>

    <script src="js/intelligent_report.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            AIAssistantShell.mount('aiAssistantMount');
            AIAssistant.init({
                userName: '张三',
                sceneId: 'intelligent_report',
                welcomeMessage: '您好，{userName}！我是您的安全生产AI助手，请向我提问吧'
            });
            AppShell.init({ pageId: 'intelligent_report' });
            AppShell.navigateToPageById('intelligent_report', { skipHash: true });
        });
    </script>
