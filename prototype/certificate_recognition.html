    <script>
        // 页面导航函数
        function navigateToPage(page) {
            window.location.href = page;
        }

        // Element Plus 文件上传组件初始化
        const { createApp, ref } = Vue;

        const FileUploadApp = {
            setup() {
                const fileList = ref([]);

                // 预览文件
                const handlePreview = (uploadFile) => {
                    console.log('预览文件:', uploadFile.name);
                    // 如果是图片,可以预览
                    if (uploadFile.raw && uploadFile.raw.type.startsWith('image/')) {
                        const url = URL.createObjectURL(uploadFile.raw);
                        previewFullImage(url);
                    } else {
                        ElementPlus.ElMessage.info('PDF文件无法预览,请下载后查看');
                    }
                };

                // 删除文件
                const handleRemove = (uploadFile, uploadFiles) => {
                    console.log('删除文件:', uploadFile.name);
                    // 同步更新全局状态
                    if (window.chatState) {
                        window.chatState.uploadedFiles = uploadFiles.map(f => {
                            if (f.raw) {
                                return {
                                    url: URL.createObjectURL(f.raw),
                                    name: f.name
                                };
                            }
                            return f;
                        });
                    }
                };

                // 文件变化时触发AI识别弹窗
                const handleChange = (uploadFile, uploadFiles) => {
                    if (uploadFile.status === 'ready' && uploadFiles.length > 0) {
                        // 更新全局状态
                        if (window.chatState) {
                            window.chatState.uploadedFiles = uploadFiles.map(f => {
                                if (f.raw) {
                                    return {
                                        url: URL.createObjectURL(f.raw),
                                        name: f.name
                                    };
                                }
                                return f;
                            });
                        }

                        // 显示AI识别弹窗
                        setTimeout(() => {
                            const fileCount = document.getElementById('fileCount');
                            const aiModal = document.getElementById('aiModal');
                            if (fileCount) fileCount.innerText = uploadFiles.length;
                            if (aiModal) aiModal.style.display = 'flex';
                        }, 300);
                    }
                };

                // 超出数量限制
                const handleExceed = (files, uploadFiles) => {
                    ElementPlus.ElMessage.warning('最多只能上传 5 个文件');
                };

                // 触发AI识别
                const triggerAIRecognition = (event) => {
                    if (fileList.value.length === 0) {
                        ElementPlus.ElMessage.warning('请先上传文件');
                        return;
                    }

                    // 防止重复点击:检查是否正在分析中
                    if (window.chatState && window.chatState.isAnalyzing) {
                        ElementPlus.ElMessage.info('AI正在分析中,请稍候...');
                        return;
                    }

                    // 触发粒子特效
                    const btn = event?.target?.closest('.ai-recognize-btn') || document.querySelector('.ai-recognize-btn');
                    if (btn && typeof createParticleEffect === 'function') {
                        createParticleEffect(btn);
                    }

                    // 收集所有文件的URL
                    const fileUrls = fileList.value.map(file => {
                        if (file.raw) {
                            return URL.createObjectURL(file.raw);
                        }
                        return file.url;
                    });

                    // 更新全局状态
                    if (window.chatState) {
                        window.chatState.uploadedFiles = fileUrls.map((url, index) => ({
                            url: url,
                            name: fileList.value[index].name
                        }));
                    }

                    // 打开AI助手侧边栏(仅当未打开时)
                    const sidebar = document.getElementById('aiSidebar');
                    if (sidebar && !sidebar.classList.contains('active')) {
                        if (typeof toggleAI === 'function') {
                            toggleAI();
                        }
                    }

                    // 立即设置分析中标志,防止重复点击
                    if (window.chatState) {
                        window.chatState.isAnalyzing = true;
                    }

                    // 将文件发送到AI助手进行分析
                    setTimeout(() => {
                        // 添加用户消息(显示文件)
                        if (typeof addUserMessage === 'function') {
                            addUserMessage('请帮我识别这些证照文件中的信息', fileUrls, true);
                        }

                        // 模拟AI分析
                        if (typeof simulateAIAnalysis === 'function') {
                            simulateAIAnalysis();
                        }
                    }, 300);
                };

                return {
                    fileList,
                    handlePreview,
                    handleRemove,
                    handleChange,
                    handleExceed,
                    triggerAIRecognition
                };
            }
        };

        // 创建Vue应用并挂载
        const fileApp = createApp(FileUploadApp);
        fileApp.use(ElementPlus);

        // 注册Element Plus图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            fileApp.component(key, component);
        }

        fileApp.mount('#fileUploadApp');
    </script>

    <script>
        // 添加人员对话框组件
        const AddPersonnelDialogApp = {
            setup() {
                const { ref, onMounted } = Vue;
                
                const addMethodDialogVisible = ref(false);

                // 从人员清单中选择
                const selectFromList = () => {
                    addMethodDialogVisible.value = false;
                    ElementPlus.ElMessage.info('从人员清单中选择功能开发中...');
                };

                // 识别证照录入 - 直接打开文件选择
                const recognizeCredential = () => {
                    addMethodDialogVisible.value = false;
                    
                    // 创建文件输入元素
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/jpeg,image/png';
                    input.multiple = true;
                    
                    input.onchange = (e) => {
                        const files = Array.from(e.target.files);
                        
                        if (files.length === 0) {
                            return;
                        }
                        
                        if (files.length > 5) {
                            ElementPlus.ElMessage.warning('最多只能上传 5 张证照');
                            return;
                        }
                        
                        // 将文件转换为URL
                        const imageUrls = [];
                        let loadedCount = 0;
                        
                        files.forEach(file => {
                            const reader = new FileReader();
                            reader.onload = (readerEvent) => {
                                imageUrls.push(readerEvent.target.result);
                                loadedCount++;
                                
                                // 所有文件都加载完成后，开始识别
                                if (loadedCount === files.length) {
                                    startPersonnelRecognitionWithImages(imageUrls);
                                }
                            };
                            reader.readAsDataURL(file);
                        });
                    };
                    
                    // 触发文件选择
                    input.click();
                };

                // 使用图片开始人员证件识别
                const startPersonnelRecognitionWithImages = (imageUrls) => {
                    console.log('开始人员证件识别，图片数量:', imageUrls.length);
                    
                    // 触发粒子特效（从屏幕中心发出）
                    if (typeof createParticleEffect === 'function') {
                        const centerBtn = {
                            getBoundingClientRect: () => ({
                                left: window.innerWidth / 2,
                                top: window.innerHeight / 2,
                                width: 0,
                                height: 0
                            })
                        };
                        createParticleEffect(centerBtn);
                    }

                    // 打开AI助手侧边栏
                    const sidebar = document.getElementById('aiSidebar');
                    if (sidebar && !sidebar.classList.contains('active')) {
                        if (typeof toggleAI === 'function') {
                            toggleAI();
                        }
                    }

                    // 延迟发送消息
                    setTimeout(() => {
                        // 设置分析中标志
                        if (window.chatState) {
                            window.chatState.isAnalyzing = true;
                            window.chatState.recognitionType = 'personnel'; // 标记为人员证件识别
                        }

                        // 添加用户消息（显示证照图片）
                        if (typeof addUserMessage === 'function') {
                            addUserMessage('请帮我识别这些人员证件中的信息', imageUrls, true);
                        }

                        // 模拟AI分析人员证件
                        if (typeof simulatePersonnelRecognition === 'function') {
                            simulatePersonnelRecognition();
                        }
                    }, 300);
                };

                // 证照文件变化（Element Plus Upload组件使用，暂时保留）
                const handleCredentialChange = (file, fileList) => {
                    console.log('证照文件变化:', fileList.length);
                };

                // 移除证照文件（Element Plus Upload组件使用，暂时保留）
                const handleCredentialRemove = (file, fileList) => {
                    console.log('移除证照文件:', file.name);
                };

                // 超出数量限制（Element Plus Upload组件使用，暂时保留）
                const handleCredentialExceed = () => {
                    ElementPlus.ElMessage.warning('最多只能上传 5 张证照');
                };


                // 立即暴露实例到全局
                window.addPersonnelDialogInstance = {
                    addMethodDialogVisible
                };
                
                console.log('添加人员对话框组件setup完成，实例已暴露到window');

                // 在挂载后输出日志
                onMounted(() => {
                    console.log('添加人员对话框组件已挂载到DOM');
                });

                return {
                    addMethodDialogVisible,
                    selectFromList,
                    recognizeCredential
                };
            }
        };

        // 创建添加人员对话框应用并挂载
        const addPersonnelDialogApp = Vue.createApp(AddPersonnelDialogApp);
        addPersonnelDialogApp.use(ElementPlus);

        // 注册Element Plus图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            addPersonnelDialogApp.component(key, component);
        }

        addPersonnelDialogApp.mount('#addPersonnelDialogApp');
    </script>
