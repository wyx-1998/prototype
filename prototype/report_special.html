<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全生产专项汇报材料</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="components/ai-assistant.css">
    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --border: #e6eaf2;
            --text: #101828;
            --muted: #667085;
            --blue: #3366cc;
            --blue-light: #edf4ff;
            --shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Inter", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .workspace-frame {
            width: min(1520px, 100%);
            height: min(920px, calc(100vh - 48px));
            display: grid;
            grid-template-columns: 400px minmax(0, 1fr);
            gap: 24px;
        }

        .conversation-shell,
        .document-shell {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 0;
        }

        .conversation-shell {
            position: relative;
        }

        .conversation-shell #aiAssistantMount {
            width: 100%;
            height: 100%;
        }

        .conversation-shell .ai-assistant-shell-mount {
            width: 100%;
            flex: none;
        }

        .conversation-shell .ai-sidebar {
            position: relative;
            top: auto;
            right: auto;
            bottom: auto;
            width: 100%;
            height: 100%;
            transform: none;
            box-shadow: none;
            border-left: none;
            z-index: auto;
        }

        .conversation-shell .ai-floating-btn,
        .conversation-shell .skills-manage-overlay,
        .conversation-shell #aiFileInput {
            display: none !important;
        }

        .conversation-shell .ai-header {
            border-bottom: 1px solid var(--ai-border-color);
        }

        .conversation-shell .ai-chat-body {
            min-height: 0;
        }

        .conversation-shell .report-doc-card {
            background: #fff;
            border: 1px solid #d9dee8;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 100%;
        }

        .conversation-shell .report-doc-card-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            background: #eef4ff;
            font-size: 22px;
            flex: 0 0 auto;
        }

        .conversation-shell .report-doc-card-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .conversation-shell .report-doc-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #101828;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-shell .report-doc-card-meta {
            font-size: 12px;
            color: #98a2b3;
        }

        .document-shell {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .document-toolbar {
            height: 78px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .document-meta-title {
            font-size: 14px;
            color: var(--muted);
        }

        .document-meta-time {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .document-toolbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .toolbar-btn {
            height: 38px;
            padding: 0 14px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .toolbar-btn.primary {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .document-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            background: #f7f9fc;
            min-height: 0;
        }

        .document-page {
            width: min(880px, 100%);
            margin: 0 auto;
            background: #fff;
            border: 1px solid #edf1f6;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
            padding: 56px 64px;
        }

        .document-title {
            margin: 0 0 36px;
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            line-height: 1.35;
            outline: none;
        }

        .document-section {
            margin-bottom: 28px;
        }

        .document-section-title {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            outline: none;
        }

        .document-section-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.95;
            color: #1f2937;
            white-space: pre-wrap;
            outline: none;
        }

        .document-title:focus,
        .document-section-title:focus,
        .document-section-text:focus {
            background: var(--blue-light);
        }

        @media (max-width: 900px) {
            html, body { overflow: auto; }
            body { display: block; }
            .workspace-frame {
                width: 100%;
                height: auto;
                grid-template-columns: 1fr;
            }
            .conversation-shell,
            .document-shell {
                height: 640px;
            }
        }
    </style>
</head>
<body>
<div class="workspace-frame">
    <aside class="conversation-shell">
        <div id="aiAssistantMount"></div>
    </aside>

    <section class="document-shell">
        <div class="document-toolbar">
            <div>
                <div class="document-meta-title">文档编辑区</div>
                <div class="document-meta-time" id="lastUpdated">修改于 --</div>
            </div>
            <div class="document-toolbar-actions">
                <button class="toolbar-btn" id="copyBtn"><i class="ph ph-copy"></i>复制</button>
                <button class="toolbar-btn primary" id="downloadBtn"><i class="ph ph-download-simple"></i>下载</button>
            </div>
        </div>
        <div class="document-scroll">
            <article class="document-page" id="documentSheet">
                <h1 class="document-title" id="docTitle" contenteditable="true"></h1>
                <div id="docSections"></div>
            </article>
        </div>
    </section>
</div>

<script src="components/ai-assistant-shell.js"></script>
<script src="components/ai-assistant-scenes.js"></script>
<script src="components/ai-assistant.js"></script>
<script>
    (function () {
        const STORAGE_KEY = 'report_workspace_payload:report_special.html';
        const DOC_DRAFT_KEY = 'report_workspace_draft:report_special.html';
        const DEFAULT_DATA = {
            title: '安全生产专项汇报材料',
            requestText: '把这个结果整理成一份专项汇报材料',
            sections: [
                { title: '一、总体情况', text: '本期安全生产运行总体可控，但隐患高发厂区、逾期整改和高风险外委作业叠加出现，需要重点关注。' },
                { title: '二、主要风险', text: '跃欣光伏厂区隐患数量居高，输电线路类问题整改周期偏长；电仪检修班、输电运维班和外委检修协作班高风险作业集中；外委问题集中在华安检修等单位。' },
                { title: '三、重点对象', text: '建议将跃欣光伏厂区、电仪检修班和华安检修列为近期重点跟踪对象，并对临边防护、临时用电和输电线路缺陷治理开展专项排查。' },
                { title: '四、下一步安排', text: '对逾期整改实施周度督办，对高风险作业开展班组级复盘，对外委单位实施资质、培训、票证和监护的联合检查。' }
            ],
            conversation: [
                { type: 'ai', content: '您好，张三！我是您的安全生产AI助手，请向我提问吧' },
                { type: 'user', content: '把这个结果整理成一份专项汇报材料' },
                { type: 'ai', content: '已将当前问数结果整理为专项汇报材料，适合向管理层演示“从问到数、从数到材料”的闭环。' }
            ]
        };

        function readJSON(key) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                return null;
            }
        }

        function getPayload() {
            const latest = readJSON(STORAGE_KEY) || DEFAULT_DATA;
            const draft = readJSON(DOC_DRAFT_KEY);
            if (draft && Array.isArray(draft.sections) && draft.title) {
                return Object.assign({}, latest, {
                    title: draft.title,
                    sections: draft.sections
                });
            }
            return latest;
        }

        function renderDocument(payload) {
            document.getElementById('docTitle').textContent = payload.title || '';
            const sectionsEl = document.getElementById('docSections');
            sectionsEl.innerHTML = '';
            (payload.sections || []).forEach(function (section) {
                const wrapper = document.createElement('section');
                wrapper.className = 'document-section';

                const title = document.createElement('h2');
                title.className = 'document-section-title';
                title.contentEditable = 'true';
                title.textContent = section.title || '';

                const text = document.createElement('p');
                text.className = 'document-section-text';
                text.contentEditable = 'true';
                text.textContent = section.text || '';

                wrapper.appendChild(title);
                wrapper.appendChild(text);
                sectionsEl.appendChild(wrapper);
            });
        }

        function collectDocument() {
            return {
                title: document.getElementById('docTitle').innerText.trim(),
                sections: Array.from(document.querySelectorAll('.document-section')).map(function (section) {
                    return {
                        title: section.querySelector('.document-section-title').innerText.trim(),
                        text: section.querySelector('.document-section-text').innerText.trim()
                    };
                })
            };
        }

        function updateTimestamp() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdated').textContent = '修改于 ' + time;
        }

        function saveDraft() {
            localStorage.setItem(DOC_DRAFT_KEY, JSON.stringify(collectDocument()));
            updateTimestamp();
        }

        function buildPlainText() {
            const doc = collectDocument();
            return [doc.title].concat(doc.sections.map(function (section) {
                return section.title + '\n' + section.text;
            })).join('\n\n');
        }

        function downloadDocument() {
            const blob = new Blob([buildPlainText()], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '安全生产专项汇报材料.txt';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        async function copyDocument() {
            try {
                await navigator.clipboard.writeText(buildPlainText());
            } catch (error) {
            }
        }

        function formatConversationTime(value) {
            const date = value ? new Date(value) : new Date();
            if (Number.isNaN(date.getTime())) {
                return '--:--';
            }
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderReportCard(message, payload) {
            const html = [
                '<div class="report-doc-card">',
                '  <div class="report-doc-card-icon"><i class="ph ph-file-doc"></i></div>',
                '  <div class="report-doc-card-info">',
                '      <div class="report-doc-card-title">' + (payload.title || '报告文档') + '</div>',
                '      <div class="report-doc-card-meta">创建时间：' + formatConversationTime(message && message.timestamp) + '</div>',
                '  </div>',
                '</div>'
            ].join('');

            const messages = payload.conversation || [];
            const aiMessages = messages.filter(function (item) { return item.type === 'ai'; });
            if (aiMessages.length) {
                aiMessages[aiMessages.length - 1].content = html;
                aiMessages[aiMessages.length - 1].answerHtml = html;
            }
            return messages;
        }

        const payload = getPayload();
        const conversationMessages = renderReportCard((payload.conversation || []).filter(function (item) {
            return item.type === 'ai';
        }).slice(-1)[0], payload);
        AIAssistantShell.mount('aiAssistantMount');
        AIAssistant.init({ sceneId: 'intelligent_report' });
        AIAssistant.loadConversationMessages({
            id: 'report_workspace_special',
            title: payload.requestText || '报告生成',
            messages: conversationMessages
        });
        renderDocument(payload);
        updateTimestamp();

        document.getElementById('documentSheet').addEventListener('input', saveDraft);
        document.getElementById('downloadBtn').addEventListener('click', downloadDocument);
        document.getElementById('copyBtn').addEventListener('click', copyDocument);
    })();
</script>
</body>
</html>
