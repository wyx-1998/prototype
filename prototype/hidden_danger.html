    <!-- AI 助手组件脚本 -->
    <script src="components/ai-assistant.js?v=20260306"></script>

    <!-- 初始化 AI 助手 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化 AI 助手组件
            AIAssistant.init({
                userName: '张三',
                welcomeMessage: '您好，{userName}！我是您的安全生产AI助手，请向我提问吧',
                onAnalysisComplete: function (results) {
                    console.log('AI 分析完成，共识别出', results.length, '个隐患');
                },
                onInsertToForm: function (selectedResults) {
                    // 将分析结果插入到表单中
                    console.log('选中的分析结果：', selectedResults);

                    if (selectedResults.length === 0) {
                        ElementPlus.ElMessage.warning('请先选择要插入的隐患分析结果');
                        return;
                    }

                    // 收集选中的内容
                    const descriptions = [];
                    const measures = [];

                    selectedResults.forEach(result => {
                        descriptions.push(`【${result.name}】${result.description}`);
                        measures.push(`【${result.name}】${result.measure || result.suggestion}`);
                    });

                    // 获取表单字段
                    const descTextarea = document.querySelector('.form-group.full-width .textarea-wrapper textarea');
                    const measureTextarea = document.querySelectorAll('.form-group.full-width .textarea-wrapper textarea')[1];

                    // 插入内容
                    if (descTextarea) {
                        descTextarea.value = descriptions.join('\n\n');
                        // 更新字数统计
                        const charCount = descTextarea.parentElement.querySelector('.char-count');
                        if (charCount) charCount.textContent = `${descTextarea.value.length}/200`;
                    }

                    if (measureTextarea) {
                        measureTextarea.value = measures.join('\n\n');
                        // 更新字数统计
                        const charCount = measureTextarea.parentElement.querySelector('.char-count');
                        if (charCount) charCount.textContent = `${measureTextarea.value.length}/200`;
                    }

                    ElementPlus.ElMessage.success('已成功插入到问题登记表');
                }
            });
        });
    </script>

    <!-- 页面特定功能脚本 -->
    <script src="js/hidden_danger.js"></script>
    <script>
        // 页面导航函数
        function navigateToPage(page) {
            window.location.href = page;
        }

        // Element Plus Photo Wall 组件初始化
        const { createApp, ref } = Vue;

        const PhotoUploadApp = {
            setup() {
                const fileList = ref([]);
                const dialogImageUrl = ref('');
                const dialogVisible = ref(false);

                // 预览图片
                const handlePreview = (uploadFile) => {
                    dialogImageUrl.value = uploadFile.url;
                    dialogVisible.value = true;
                };

                // 删除图片
                const handleRemove = (uploadFile, uploadFiles) => {
                    console.log('删除图片:', uploadFile.name);
                };

                // 文件变化时触发AI识别弹窗
                const handleChange = (uploadFile, uploadFiles) => {
                    if (uploadFile.status === 'ready' && uploadFiles.length > 0) {
                        // 显示AI识别弹窗
                        setTimeout(() => {
                            const photoCount = document.getElementById('photoCount');
                            const aiModal = document.getElementById('aiModal');
                            if (photoCount) photoCount.innerText = uploadFiles.length;
                            if (aiModal) aiModal.style.display = 'flex';
                        }, 300);
                    }
                };

                // 超出数量限制
                const handleExceed = (files, uploadFiles) => {
                    ElementPlus.ElMessage.warning('最多只能上传 5 张图片');
                };

                // 触发AI识别
                const triggerAIRecognition = (event) => {
                    if (fileList.value.length === 0) {
                        ElementPlus.ElMessage.warning('请先上传照片');
                        return;
                    }

                    // 防止重复点击：检查是否正在分析中
                    if (AIAssistant && AIAssistant.state.isAnalyzing) {
                        ElementPlus.ElMessage.info('AI正在分析中，请稍候...');
                        return;
                    }

                    // 触发粒子特效
                    const btn = event?.target?.closest('.ai-recognize-btn') || document.querySelector('.ai-recognize-btn');
                    if (btn && typeof createParticleEffect === 'function') {
                        createParticleEffect(btn);
                    }

                    // 收集所有图片的URL
                    const imageUrls = fileList.value.map(file => file.url || URL.createObjectURL(file.raw));

                    // 打开AI助手侧边栏（仅当未打开时）
                    const sidebar = document.getElementById('aiSidebar');
                    if (sidebar && !sidebar.classList.contains('active')) {
                        if (typeof AIAssistant.toggleAI === 'function') {
                            AIAssistant.toggleAI();
                        }
                    }

                    // 将图片发送到AI助手进行分析
                    setTimeout(() => {
                        // 添加用户消息（显示图片）并触发AI分析
                        if (typeof AIAssistant.addUserMessage === 'function') {
                            AIAssistant.addUserMessage('请帮我识别这些照片中的安全隐患', imageUrls, true);
                        }

                        // 模拟AI分析
                        if (typeof AIAssistant.simulateAIAnalysis === 'function') {
                            AIAssistant.simulateAIAnalysis();
                        }
                    }, 300);
                };

                return {
                    fileList,
                    dialogImageUrl,
                    dialogVisible,
                    handlePreview,
                    handleRemove,
                    handleChange,
                    handleExceed,
                    triggerAIRecognition
                };
            }
        };

        // 创建Vue应用并挂载
        const app = createApp(PhotoUploadApp);
        app.use(ElementPlus);

        // 注册Element Plus图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }

        app.mount('#photoUploadApp');
    </script>

    <script>
        // Element Plus 视频上传组件初始化
        const VideoUploadApp = {
            setup() {
                const videoList = Vue.ref([]);

                // 格式化文件大小
                const formatSize = (bytes) => {
                    if (!bytes) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                };

                // 上传前校验
                const beforeVideoUpload = (file) => {
                    const isMP4 = file.type === 'video/mp4';
                    const isLt50M = file.size / 1024 / 1024 < 50;

                    if (!isMP4) {
                        ElementPlus.ElMessage.error('只能上传 MP4 格式的视频!');
                        return false;
                    }
                    if (!isLt50M) {
                        ElementPlus.ElMessage.error('视频大小不能超过 50MB!');
                        return false;
                    }
                    return true;
                };

                // 删除视频
                const handleVideoRemove = (file) => {
                    const index = videoList.value.findIndex(f => f.uid === file.uid);
                    if (index > -1) {
                        videoList.value.splice(index, 1);
                    }
                    console.log('删除视频:', file.name);
                };

                // 文件变化
                const handleVideoChange = (file, files) => {
                    console.log('视频列表变化:', files.length);
                };

                // 超出数量限制
                const handleVideoExceed = (files, uploadFiles) => {
                    ElementPlus.ElMessage.warning('最多只能上传 5 个视频');
                };

                return {
                    videoList,
                    formatSize,
                    beforeVideoUpload,
                    handleVideoRemove,
                    handleVideoChange,
                    handleVideoExceed
                };
            }
        };

        // 创建视频上传Vue应用并挂载
        const videoApp = Vue.createApp(VideoUploadApp);
        videoApp.use(ElementPlus);

        // 注册Element Plus图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            videoApp.component(key, component);
        }

        videoApp.mount('#videoUploadApp');
    </script>
